# Tests on every push and pull request. Tests that need the downloaded packs or built engine skip themselves here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Engine tests
        run: cargo test --release
        working-directory: engine
      - name: App tests
        run: |
          flutter pub get
          flutter analyze
          flutter test --concurrency=2
