# Build both installers and publish a GitHub release when a version tag is pushed:
#   1. set the version in pubspec.yaml and lib/app/version.dart (they must be equal)
#   2. git tag v1.2.0 && git push origin v1.2.0
# The release carries Scriptura-Setup.exe, Scriptura.apk and SHA256SUMS.txt; file names never carry the version
# (the version is shown in the app and in the release title). docs/RELEASING.md has the manual steps this mirrors.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the app version
        shell: bash
        run: |
          v=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pubspec.yaml says $v"; exit 1; }

      # Every machine here would make its own temporary key, so phones could never update from one release to the next.
      # The release stops unless the store key is in the repository secrets (Settings > Secrets and variables > Actions):
      # ANDROID_KEYSTORE_BASE64 (the .jks file, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Android store key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::No Android store key in the repository secrets: add it before releasing (see the comment above)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Android engine (arm64)
        shell: bash
        run: python -I tool/build_engine_android.py --ndk "$ANDROID_NDK_LATEST_HOME"

      - name: Android package
        shell: bash
        run: |
          flutter build apk --release --target-platform android-arm64
          mkdir -p generated-artifacts/dist
          cp build/app/outputs/flutter-apk/app-release.apk generated-artifacts/dist/app-release.apk

      - name: Windows installer (engine, app, Inno Setup)
        env:
          ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: python -I tool/build_installer.py

      - name: Stage and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I tool/make_release.py
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" generated-artifacts/release-assets/$v/Scriptura-Setup.exe \
            generated-artifacts/release-assets/$v/Scriptura.apk generated-artifacts/release-assets/$v/SHA256SUMS.txt \
            --title "Scriptura $v" --notes-file generated-artifacts/release-assets/$v/RELEASE_NOTES.md --latest
