name: scriptures_reader_mobile
description: Mobile offline scripture reader with full search intelligence parity.
publish_to: 'none'
version: 1.0.11+12

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  crypto: ^3.0.3
  sqlite3: ^3.7.1
  path: ^1.9.1
  ffi: ^2.2.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/trail_moods.json
    - assets/trail_starters.json
    - assets/genome_labels.json
  fonts:
    # Interface face: Inter (SIL Open Font License; Inter-LICENSE.txt alongside)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Optional reading faces (SIL Open Font License; licence files alongside): Literata and Atkinson Hyperlegible
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    # Scripture text face: Source Serif 4 (SIL Open Font License; licence file alongside)
    - family: ScriptureSerif
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-It.ttf
          style: italic
        - asset: assets/fonts/SourceSerif4-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
    # App theme faces (Classic, Modern, Elegant, Aesthetic; SIL Open Font License; licence files alongside)
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-400-Italic.ttf
          style: italic
        - asset: assets/fonts/EBGaramond-400.ttf
        - asset: assets/fonts/EBGaramond-600.ttf
          weight: 600
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-400-Italic.ttf
          style: italic
        - asset: assets/fonts/CormorantGaramond-400.ttf
        - asset: assets/fonts/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-400.ttf
        - asset: assets/fonts/Jost-500.ttf
          weight: 500
        - asset: assets/fonts/Jost-600.ttf
          weight: 600
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-400-Italic.ttf
          style: italic
        - asset: assets/fonts/Fraunces-400.ttf
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
